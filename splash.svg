<svg width=1080 height=1920 viewBox=0 0 1080 1920
     xmlns=http://www.w3.org/2000/svg>

  <defs>

    <!-- Light Mode Gradients -->
    <linearGradient id=splash-bg x1=0 y1=0 x2=1 y2=1>
      <stop offset=0% stop-color=#FFFFFF/>
      <stop offset=52% stop-color=#F5F8FF/>
      <stop offset=100% stop-color=#E8F0FF/>
    </linearGradient>

    <linearGradient id=splash-bottomBlue x1=0 y1=0 x2=1 y2=1>
      <stop offset=0% stop-color=#78AAFF/>
      <stop offset=45% stop-color=#327BFF/>
      <stop offset=100% stop-color=#1459E8/>
    </linearGradient>

    <linearGradient id=splash-paleBlue x1=0 y1=0 x2=1 y2=1>
      <stop offset=0% stop-color=#EAF2FF/>
      <stop offset=100% stop-color=#C8DAFF/>
    </linearGradient>

    <!-- Dark Mode Gradients -->
    <linearGradient id=splash-bg-dark x1=0 y1=0 x2=1 y2=1>
      <stop offset=0% stop-color=#080B14/>
      <stop offset=50% stop-color=#0F172A/>
      <stop offset=100% stop-color=#070A12/>
    </linearGradient>

    <linearGradient id=splash-bottomBlue-dark x1=0 y1=0 x2=1 y2=1>
      <stop offset=0% stop-color=#3B82F6/>
      <stop offset=50% stop-color=#1D4ED8/>
      <stop offset=100% stop-color=#0F172A/>
    </linearGradient>

    <!-- Logo shadow/glow -->
    <filter id=splash-logoShadow x=-50% y=-50% width=200% height=200%>
      <feDropShadow dx=0 dy=24 stdDeviation=28 flood-color=#1E3A8A flood-opacity=0.18/>
    </filter>

    <!-- Soft glow -->
    <filter id=splash-softGlow x=-100% y=-100% width=300% height=300%>
      <feGaussianBlur stdDeviation=45/>
    </filter>

  </defs>

  <!-- BACKGROUND -->
  <rect width=1080 height=1920 fill=url(#splash-bg) class=splash-bg-rect/>

  <!-- TOP LEFT ORBIT -->
  <circle cx=-25 cy=-20 r=390 fill=url(#splash-paleBlue) opacity=0.55 class=splash-orbit-fill/>
  <circle cx=-25 cy=-20 r=465 fill=none stroke=#BFD2FF stroke-width=2 opacity=0.7 class=splash-orbit-stroke/>
  <circle cx=300 cy=315 r=13 fill=#7BAAFF class=splash-orbit-accent/>

  <!-- TOP RIGHT SOFT SPHERE -->
  <circle cx=1050 cy=180 r=220 fill=#DCE8FF opacity=0.65 class=splash-sphere-1/>
  <circle cx=1050 cy=180 r=340 fill=none stroke=#C7D8FF stroke-width=2 opacity=0.6 class=splash-sphere-2/>

  <!-- DOT GRID TOP RIGHT -->
  <g fill=#B9D0FF opacity=0.65 class=splash-dot-grid>
    <circle cx=720 cy=80 r=3/><circle cx=755 cy=80 r=3/><circle cx=790 cy=80 r=3/><circle cx=825 cy=80 r=3/><circle cx=860 cy=80 r=3/>
    <circle cx=720 cy=115 r=3/><circle cx=755 cy=115 r=3/><circle cx=790 cy=115 r=3/><circle cx=825 cy=115 r=3/><circle cx=860 cy=115 r=3/>
    <circle cx=720 cy=150 r=3/><circle cx=755 cy=150 r=3/><circle cx=790 cy=150 r=3/><circle cx=825 cy=150 r=3/><circle cx=860 cy=150 r=3/>
    <circle cx=720 cy=185 r=3/><circle cx=755 cy=185 r=3/><circle cx=790 cy=185 r=3/><circle cx=825 cy=185 r=3/><circle cx=860 cy=185 r=3/>
    <circle cx=720 cy=220 r=3/><circle cx=755 cy=220 r=3/><circle cx=790 cy=220 r=3/><circle cx=825 cy=220 r=3/><circle cx=860 cy=220 r=3/>
  </g>

  <!-- CENTRAL LOGO GLOW -->
  <circle cx=540 cy=810 r=280 fill=#7EAEFF opacity=0.22 filter=url(#splash-softGlow) class=splash-glow-pulse/>

  <!-- SCHEDULLY AUTHENTIC S LOGO -->
  <g filter=url(#splash-logoShadow) class=splash-logo-pop>
    <rect x=380 y=650 width=320 height=320 rx=72 fill=#FFFFFF class=splash-logo-badge/>
    <image href=logo-transparent.png x=400 y=670 width=280 height=280 preserveAspectRatio=xMidYMid meet/>
  </g>

  <!-- LOWER ABSTRACT WAVES -->
  <path class=splash-wave-1 d=M 0 1030 C 150 1090 230 1200 360 1320 C 500 1450 610 1500 760 1460 C 880 1427 965 1345 1080 1280 L 1080 1920 L 0 1920 Z fill=#E5EEFF opacity=0.85/>
  <path class=splash-wave-2 d=M 0 1375 C 150 1290 260 1370 390 1475 C 520 1580 640 1620 780 1570 C 900 1528 1000 1430 1080 1370 L 1080 1920 L 0 1920 Z fill=#D5E4FF opacity=0.8/>
  <path class=splash-wave-3 d=M 0 1505 C 155 1400 290 1490 430 1600 C 570 1710 700 1775 850 1700 C 950 1650 1010 1570 1080 1515 L 1080 1920 L 0 1920 Z fill=url(#splash-bottomBlue)/>
  <path class=splash-wave-4 d=M 0 1590 C 170 1495 295 1590 445 1700 C 590 1805 730 1840 880 1770 C 975 1725 1030 1660 1080 1620 L 1080 1920 L 0 1920 Z fill=#2B73F4 opacity=0.32/>

  <!-- LOWER ORBIT LINE -->
  <path class=splash-orbit-line d=M -100 1600 C 190 1470 430 1660 640 1770 C 820 1865 1000 1850 1170 1750 fill=none stroke=#FFFFFF stroke-width=3 opacity=0.75/>

  <!-- LOWER RIGHT ORB -->
  <circle class=splash-orb-inner cx=925 cy=1630 r=105 fill=#EAF2FF opacity=0.55/>
  <circle class=splash-orb-outer cx=925 cy=1630 r=150 fill=none stroke=#A9C6FF stroke-width=2 opacity=0.65/>

  <!-- LOWER LEFT DOT GRID -->
  <g fill=#AFCBFF opacity=0.7 class=splash-dot-grid>
    <circle cx=70 cy=1470 r=3/><circle cx=105 cy=1470 r=3/><circle cx=140 cy=1470 r=3/><circle cx=175 cy=1470 r=3/><circle cx=210 cy=1470 r=3/>
    <circle cx=70 cy=1505 r=3/><circle cx=105 cy=1505 r=3/><circle cx=140 cy=1505 r=3/><circle cx=175 cy=1505 r=3/><circle cx=210 cy=1505 r=3/>
    <circle cx=70 cy=1540 r=3/><circle cx=105 cy=1540 r=3/><circle cx=140 cy=1540 r=3/><circle cx=175 cy=1540 r=3/><circle cx=210 cy=1540 r=3/>
    <circle cx=70 cy=1575 r=3/><circle cx=105 cy=1575 r=3/><circle cx=140 cy=1575 r=3/><circle cx=175 cy=1575 r=3/><circle cx=210 cy=1575 r=3/>
  </g>

</svg>
